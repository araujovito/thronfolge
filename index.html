<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thronfolge — protótipo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="barra">
      <div>
        <p class="sobretitulo">Protótipo político</p>
        <h1>Thronfolge</h1>
      </div>
      <div class="tempo">
        <span id="data">2 de julho de 936</span>
        <button id="avancar" type="button">Avançar um mês</button>
      </div>
    </header>

    <main class="jogo">
      <section class="painel mapa-painel" aria-labelledby="titulo-mapa">
        <div class="cabecalho-painel">
          <div>
            <p class="sobretitulo">Reino Franco Oriental</p>
            <h2 id="titulo-mapa">Os cinco ducados</h2>
          </div>
          <span class="aviso">Mapa esquemático — fronteiras provisórias</span>
        </div>
        <div id="mapa" class="mapa" aria-label="Mapa político esquemático"></div>
      </section>

      <aside class="painel personagem-painel" aria-live="polite">
        <p class="sobretitulo">Perspectiva selecionada</p>
        <h2 id="nome-personagem">Carregando…</h2>
        <p id="titulo-personagem" class="titulo-personagem"></p>
        <dl class="atributos">
          <div><dt>Legitimidade</dt><dd id="legitimidade">—</dd></div>
          <div><dt>Territórios</dt><dd id="territorios">—</dd></div>
          <div><dt>Memórias</dt><dd id="total-memorias">—</dd></div>
        </dl>
        <h3>Relações percebidas</h3>
        <div id="relacoes" class="relacoes"></div>
      </aside>

      <section class="painel noticias-painel" aria-labelledby="titulo-noticias">
        <div class="cabecalho-painel">
          <div>
            <p class="sobretitulo">Conhecimento limitado</p>
            <h2 id="titulo-noticias">Relatos conhecidos</h2>
          </div>
          <div class="controles-save">
            <button id="salvar" type="button" class="secundario">Salvar</button>
            <button id="carregar" type="button" class="secundario">Carregar</button>
            <button id="reiniciar" type="button" class="secundario">Reiniciar</button>
          </div>
        </div>
        <p id="estado-save" class="estado-save" role="status"></p>
        <ol id="noticias" class="noticias"></ol>
      </section>
    </main>

    <script type="module" src="src/interface.js"></script>
  </body>
</html>
